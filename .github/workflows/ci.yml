name: Frontend CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  qualite-et-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le formatage Prettier
        run: npm run format:check

      - name: Vérifier les types TypeScript
        run: npm run typecheck

      - name: Linter ESLint
        run: npm run lint

      - name: Exécuter les tests unitaires Vitest
        run: npm run test

      - name: Compiler le bundle PWA
        run: npm run build
